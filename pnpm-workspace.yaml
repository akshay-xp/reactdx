packages:
  - packages/*
  - apps/*
  - fixtures/*
  - test-env/*
  - bench/*

peerDependencyRules:
  # The Vite fixture's aliases rewrite react-dom's own `react` import to the matching version per mode.
  allowedVersions:
    react-dom>react: "18 || 19"

onlyBuiltDependencies:
  - esbuild
  - puppeteer
